    // -------------------------
    // i18n infra
    // Priority: ?lang=  > saved choice > browser language
    // -------------------------
    function detectLang() {
      const url = new URL(window.location.href);
      const qLang = (url.searchParams.get("lang") || "").toLowerCase();
      if (["fr","en","es"].includes(qLang)) return qLang;

      const saved = (localStorage.getItem("pl_lang") || "").toLowerCase();
      if (["fr","en","es"].includes(saved)) return saved;

      const nav = (navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language || "fr").toLowerCase();
      if (nav.startsWith("es")) return "es";
      if (nav.startsWith("en")) return "en";
      return "fr";
    }

    function setLang(lang) {
      if (!["fr","en","es"].includes(lang)) return;
      localStorage.setItem("pl_lang", lang);

      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url.toString());

      render(lang);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".lang-btn");
      if (btn) setLang(btn.dataset.lang);
    });

    function setActiveLangUI(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll(".lang-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
    }

              "El uso continuado tras una modificación implica la aceptación de los nuevos Términos."
            ]
          },
          {
            h: "10. Ley aplicable y jurisdicción competente",
            p: [
              "Estos Términos se rigen por el derecho francés.",
              "Cualquier litigio se someterá a la jurisdicción exclusiva de los tribunales franceses competentes."
            ]
          },
          {
            h: "11. Contacto",
            p: [
              "Para cualquier consulta:",
              "📧 contact@weeshiz.com"
            ]
          }
        ]
      }
    };

    function render(lang) {
      setActiveLangUI(lang);

      const t = CONTENT[lang] || CONTENT.fr;
      document.getElementById("t_title").textContent = t.title;
      document.getElementById("t_meta").textContent = t.meta;
      document.getElementById("t_home").textContent = t.home;
      document.getElementById("t_join").textContent = t.join;
      document.getElementById("t_privacy").textContent = t.privacy;
      document.getElementById("t_footerNote").textContent = t.footerNote;

      const root = document.getElementById("contentRoot");
      root.innerHTML = "";

      t.sections.forEach(sec => {
        const card = document.createElement("section");
        card.className = "section";

        const h2 = document.createElement("h2");
        h2.textContent = sec.h;
        card.appendChild(h2);

        (sec.p || []).forEach(par => {
          const p = document.createElement("p");
          p.textContent = par;
          card.appendChild(p);
        });

        if (sec.ul && sec.ul.length) {
          const ul = document.createElement("ul");
          sec.ul.forEach(liText => {
            const li = document.createElement("li");
            li.textContent = liText;
            ul.appendChild(li);
          });
          card.appendChild(ul);
        }

        root.appendChild(card);
      });
    }

    const CURRENT_LANG = detectLang();
    render(CURRENT_LANG);
  </script>
</body>
</html>
